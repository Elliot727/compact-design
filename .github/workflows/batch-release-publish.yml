name: Batch release publish

on:
  push:
    tags:
      - "v*"
  pull_request:
    types: [closed]

permissions:
  contents: write
  id-token: write

jobs:
  tag:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./packages/core/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create and push release tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists — skipping push."
            exit 0
          fi
          git tag "$TAG" "${{ github.event.pull_request.merge_commit_sha }}"
          git push origin "$TAG"

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install and build publishable packages
        run: |
          npm ci
          npm run build -w @compact-design/core
          npm run build -w @compact-design/html
          npm run build -w @compact-design/mcp

      - name: Read version
        id: version
        run: echo "version=$(node -p "require('./packages/core/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Publish to npm
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN secret is not set — skipping publish."
            echo "manual=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          npm publish -w @compact-design/core --access public
          npm publish -w @compact-design/html --access public
          npm publish -w @compact-design/mcp --access public
          echo "manual=false" >> "$GITHUB_OUTPUT"

      - name: Manual publish instructions
        if: steps.publish.outputs.manual == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat <<MD
          ## Manual publish (NPM_TOKEN missing)

          From a clean checkout of the release commit:

          \`\`\`bash
          npm ci
          npm run build -w @compact-design/core
          npm run build -w @compact-design/html
          npm run build -w @compact-design/mcp
          npm publish -w @compact-design/core --access public
          npm publish -w @compact-design/html --access public
          npm publish -w @compact-design/mcp --access public
          \`\`\`

          Do not publish \`@compact-design/figma-plugin\`. Tag: \`v${VERSION}\`.
          MD
